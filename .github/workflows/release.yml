name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev pkg-config \
            libwayland-dev libxkbcommon-dev \
            libssl-dev \
            libpam0g-dev

      - name: Install Rust (from rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
          rustc --version

      - name: Install cargo-binstall
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-deb and cargo-generate-rpm
        run: cargo binstall -y cargo-deb cargo-generate-rpm

      - name: Build release binaries
        run: cargo build --release

      - name: Determine which packages to publish
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The packages pool is the source of truth for "already
          # distributed". Rebuilding an unchanged version produces
          # byte-different files that trip the importer's no-clobber
          # guard — skip anything whose exact filenames already exist.
          in_pool() {
            gh api "repos/idlescreen/packages/contents/rpm/pool/$1" \
              --jq .name >/dev/null 2>&1 || \
            gh api "repos/idlescreen/packages/contents/apt/pool/main/$2" \
              --jq .name >/dev/null 2>&1
          }
          ver() { grep -m1 '^version' "$1/Cargo.toml" | cut -d'"' -f2; }
          daemon_v=$(ver idle-daemon)
          if in_pool "idle-daemon-${daemon_v}-1.x86_64.rpm" "idle-daemon_${daemon_v}-1_amd64.deb"; then
            echo "daemon=skip" >> "$GITHUB_OUTPUT"
          else
            echo "daemon=build" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Package crates
        run: |
          if [ "${{ steps.plan.outputs.daemon }}" = "build" ]; then
            cargo deb --no-build -p idle-daemon
            cargo generate-rpm -p idle-daemon
          fi

      - name: Install Cosign
        run: |
          curl -Lo cosign https://github.com/sigstore/cosign/releases/download/v2.2.4/cosign-linux-amd64
          chmod +x cosign
          sudo mv cosign /usr/local/bin/

      - name: Sign packages with Cosign
        run: |
          shopt -s nullglob
          for file in target/debian/*.deb target/generate-rpm/*.rpm; do
            cosign sign-blob --yes --output-signature "${file}.sig" --output-certificate "${file}.pem" "$file"
          done

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Tag arrives via env, never expression interpolation into shell.
          case "$RELEASE_TAG" in
            ""|*[!A-Za-z0-9._-]*) echo "ERROR: invalid release tag '$RELEASE_TAG'" >&2; exit 1 ;;
          esac
          [ "${#RELEASE_TAG}" -le 64 ] || { echo "ERROR: tag too long" >&2; exit 1; }
          shopt -s nullglob
          assets=(target/debian/*.deb target/debian/*.sig target/debian/*.pem \
                  target/generate-rpm/*.rpm target/generate-rpm/*.sig target/generate-rpm/*.pem)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::warning::all packages already in the pool — release has no assets"
          fi
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes "Release $RELEASE_TAG" \
            "${assets[@]}"

      - name: Trigger Packages Repository Update
        if: steps.plan.outputs.daemon == 'build' || steps.plan.outputs.cli == 'build'
        env:
          GH_TOKEN: ${{ secrets.IDLESCREEN_PACKAGES_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          DISPATCH_REPO: ${{ github.repository }}
        run: |
          # Advisory, never fatal. This dispatch is a latency optimisation,
          # not a dependency: packages' import-release.yml runs a "Sweep
          # latest releases" step on a 6-hourly cron that converges the pool
          # to every product repo's latest release whether or not a dispatch
          # ever arrived. A missing or rejected token therefore costs at most
          # one sweep window. Failing here instead would report a release that
          # published correctly as a failed run, which trains readers to
          # ignore red Xs on this workflow. Warn loudly, stay green.
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::IDLESCREEN_PACKAGES_DISPATCH_TOKEN is not set — pool will converge on the next 6-hourly sweep (import-release.yml), not now"
            exit 0
          fi
          # gh -f builds JSON-escaped fields — no raw tag interpolation.
          if ! gh api repos/idlescreen/packages/dispatches \
            -X POST \
            -f event_type=new_release \
            -f "client_payload[repo]=${DISPATCH_REPO}" \
            -f "client_payload[tag]=${RELEASE_TAG}"; then
            echo "::warning::packages dispatch rejected — the 6-hourly sweep in import-release.yml will import ${DISPATCH_REPO} ${RELEASE_TAG} instead"
          fi
