name: vigil

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  vigil:
    name: vigil
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install vigil
        run: |
          DEST="${XDG_BIN_HOME:-$HOME/.local/bin}"
          mkdir -p "$DEST"
          curl -fsSL --retry 3 https://studio2201.com/install.sh -o /tmp/v.sh
          sh /tmp/v.sh --dest "$DEST" vigil
          echo "$DEST" >> "$GITHUB_PATH"

      - name: Dormancy scan + policy
        run: |
          # vigil's built-in gates score mature crates CRITICAL on commit
          # velocity alone — unpassable for a healthy dependency tree.
          # Enforce the actionable version instead: fail only on
          # dependencies dormant over 2 years.
          MANIFEST=$(find . -maxdepth 3 \( -name "Cargo.lock" -o -name "package.json" -o -name "requirements.txt" -o -name "go.mod" \) | head -n 1)
          if [ -z "$MANIFEST" ]; then
            echo "No supported dependency manifest found." > vigil_report.md
            exit 0
          fi
          vigil scan "$MANIFEST" --format markdown > vigil_report.md || true
          DEAD=$(vigil scan "$MANIFEST" --format json | jq '[.dependencies[] | select(.days_dormant > 730)] | length')
          echo "dependencies dormant >730d: $DEAD"
          if [ "$DEAD" -ne 0 ]; then
            echo "::error file=$MANIFEST::Dependencies dormant over 2 years detected"
            exit 1
          fi

      - name: Retain Audit Findings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vigil-report
          path: vigil_report.md
          if-no-files-found: ignore
