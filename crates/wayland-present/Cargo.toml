[package]
authors = ["idlescreen developers"]
repository = "https://github.com/idlescreen/idlescreen"
name = "wayland-present"
version = "0.4.0"
edition = "2024"
description = "Wayland layer-shell overlay presenter for fullscreen idle surfaces"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
libc = { workspace = true }
idle-log.workspace = true
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }