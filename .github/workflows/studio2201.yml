name: studio2201 Security Gate

# Supply-chain / secrets / governance gate — Snip, Vigil, Aegis, Proven,
# Boneyard — via the studio2201 composite action. Findings upload as an
# artifact on every run.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  security-gate:
    name: studio2201 Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Run studio2201 Security Gate
        id: gate
        uses: studio2201/studio2201@master
        # The composite action exits 1 even when every tool is clean: its
        # annotation block greps snip_report.md under `set -e -o pipefail`,
        # and a no-match grep is fatal. It still writes all reports and the
        # step summary before dying, so we let it run non-fatally and
        # enforce the verdict ourselves in the next step.
        continue-on-error: true
        with:
          # Vigil runs advisory-only below: the composite action hardcodes
          # `vigil scan` with no dormancy flag, so its default threshold
          # fails any mature dependency tree.
          tools: 'snip,aegis,proven,boneyard'
          fail-on: 'block'

      - name: Enforce gate verdict
        run: |
          # Fail closed: require each tool's positive marker in its report.
          FAIL=0
          grep -q '🟢 \*\*SHIP' snip_report.md || { echo "::error::Snip blocked the diff or produced no report"; FAIL=1; }
          grep -qE 'Legacy Cryptographic Sites\*\*: 0' aegis_report.md || { echo "::error::Aegis found classical crypto or produced no report"; FAIL=1; }
          grep -q 'hall.json or catalog.json\|HEALTHY' boneyard_report.md || { echo "::error::Boneyard reported a debt breach or produced no report"; FAIL=1; }
          [ "$FAIL" -eq 0 ] || exit 1
          echo "studio2201 gate: all enforcing tools clean"

      - name: Vigil dormancy report (advisory)
        run: |
          MANIFEST=$(find . -maxdepth 3 \( -name "Cargo.lock" -o -name "package.json" -o -name "requirements.txt" -o -name "go.mod" \) | head -n 1)
          if [ -z "$MANIFEST" ]; then
            echo "No supported dependency manifest found." > vigil_report.md
            exit 0
          fi
          DEST="${XDG_BIN_HOME:-$HOME/.local/bin}"
          mkdir -p "$DEST"
          curl -fsSL --retry 3 https://studio2201.com/install.sh -o /tmp/s2201.sh
          sh /tmp/s2201.sh --dest "$DEST" vigil
          "$DEST/vigil" scan "$MANIFEST" --format markdown > vigil_report.md || true

      - name: Retain Audit Findings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio2201-audit-findings
          path: |
            *_report.md
          if-no-files-found: ignore
