[package]
authors = ["idlescreen developers"]
repository = "https://github.com/idlescreen/idlescreen"
name = "wayland-idle"
version = "0.4.0"
edition = "2024"
description = "Wayland idle detection via ext-idle-notify-v1"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
idle-api = { path = "../../idle-api" }
libc = { workspace = true }
idle-log.workspace = true
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
