name: Bench harness

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read
  pull-requests: write  # needed for the PR-comment integration below

jobs:
  bench:
    name: criterion benches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          if [ -f rust-toolchain.toml ]; then rustup show; else rustup default stable; fi
      # draw_frame bench calls CellRenderer::new() which loads the system
      # monospace font. ubuntu-latest doesn't ship one by default —
      # install fonts-liberation so the bench has something to load.
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libwayland-dev libxkbcommon-dev libssl-dev pkg-config libudev-dev fonts-liberation
      - name: bench (idle-upscaler/stretch)
        # --warm-up-time + --measurement-time are tuned for CI: smaller
        # windows than `cargo bench` defaults so the workflow stays
        # under the 30-minute timeout. The numbers are still
        # comparable across runs (criterion's statistical model is
        # time-budget-aware, not sample-count-aware).
        run: |
          cargo bench -p idle-upscaler --bench stretch \
            -- --warm-up-time 1 --measurement-time 3 \
            > bench-upscaler.txt 2>&1 || true
          tail -200 bench-upscaler.txt
      - name: bench (idle-daemon/draw_frame)
        run: |
          cargo bench -p idle-daemon --bench draw_frame \
            -- --warm-up-time 1 --measurement-time 3 \
            > bench-draw_frame.txt 2>&1 || true
          tail -200 bench-draw_frame.txt

      - name: regression check vs perf-baseline.json
        # Captures the regression verdict to a file so the next step
        # (PR comment) can read it. Exit 1 from compare-bench.py is
        # demoted to a warning here so the workflow always reaches the
        # PR-comment step (otherwise PR-comment would never run on a
        # regression). The PR-comment step inspects the verdict and
        # posts accordingly.
        id: regression
        run: |
          if [ -f perf-baseline.json ] && [ -f bench-upscaler.txt ]; then
            python3 scripts/compare-bench.py perf-baseline.json bench-upscaler.txt \
              > regression.txt 2>&1 || true
            cat regression.txt
            if grep -q "^REGRESSION:" regression.txt; then
              echo "regression=true" >> "$GITHUB_OUTPUT"
              echo "verdict=regression" >> "$GITHUB_OUTPUT"
            else
              echo "regression=false" >> "$GITHUB_OUTPUT"
              echo "verdict=ok" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "regression=false" >> "$GITHUB_OUTPUT"
            echo "verdict=skipped" >> "$GITHUB_OUTPUT"
            echo "Skipping regression check: missing perf-baseline.json or bench output"
          fi

      - name: PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const verdict = '${{ steps.regression.outputs.verdict }}';
            const body = require('fs').readFileSync('regression.txt', 'utf8');
            const tag = '<!-- perf-regression-gate -->';
            const header = verdict === 'regression'
              ? '⚠️ **Bench regression detected**'
              : verdict === 'ok'
              ? '✅ **No bench regression**'
              : 'ℹ️ **Bench harness ran (no baseline)**';
            const comment = [
              tag,
              header,
              '',
              '```',
              body.slice(0, 6000),
              '```',
              '',
              '<sub>Generated by runtime/.github/workflows/perf.yml. Re-run with `scripts/refresh-baseline.sh` to update the baseline (see `scripts/refresh-baseline.sh` for usage).</sub>'
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(tag));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e79e7999289bfc103d06fd04c
        with:
          name: perf-bench-results
          path: |
            bench-upscaler.txt
            bench-draw_frame.txt
            regression.txt
          retention-days: 30