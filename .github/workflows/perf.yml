name: Bench harness

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read
  pull-requests: write  # needed for the PR-comment integration below

jobs:
  bench:
    name: criterion benches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          if [ -f rust-toolchain.toml ]; then rustup show; else rustup default stable; fi
      # draw_frame bench calls CellRenderer::new() which loads the system
      # monospace font. ubuntu-latest doesn't ship one by default —
      # install fonts-liberation so the bench has something to load.
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libwayland-dev libxkbcommon-dev libssl-dev pkg-config libudev-dev fonts-liberation
      # Only the T1 targets are run. wayland-present's `hot_path` and the
      # other T2 benches are deliberately absent: §4 promises T2 is
      # benched on demand, not gated, and CI minutes are finite.
      - name: bench (idle-upscaler/stretch)
        # --warm-up-time + --measurement-time are tuned for CI: smaller
        # windows than `cargo bench` defaults so the workflow stays
        # under the 30-minute timeout. The numbers are still
        # comparable across runs (criterion's statistical model is
        # time-budget-aware, not sample-count-aware).
        #
        # `|| true`: criterion exits non-zero when it records a change
        # against a previous run, which is not a build failure. The
        # verdict comes from compare-bench.py below, which reads
        # criterion's JSON rather than trusting this exit code.
        run: |
          cargo bench -p idle-upscaler --bench stretch \
            -- --warm-up-time 1 --measurement-time 3 \
            > bench-upscaler.txt 2>&1 || true
          tail -200 bench-upscaler.txt
      - name: bench (idle-daemon/draw_frame)
        run: |
          cargo bench -p idle-daemon --bench draw_frame \
            -- --warm-up-time 1 --measurement-time 3 \
            > bench-draw_frame.txt 2>&1 || true
          tail -200 bench-draw_frame.txt

      - name: regression check vs perf-baseline.json
        # Reads criterion's own machine JSON (target/criterion/**/new/
        # estimates.json) — never the scraped text above, whose format
        # has shifted between criterion releases and previously made a
        # compare silently report zero entries.
        #
        # The verdict goes to a file and to $GITHUB_OUTPUT rather than
        # failing here, so the PR-comment step below always runs.
        id: regression
        run: |
          set +e
          python3 scripts/compare-bench.py perf-baseline.json target/criterion \
            > regression.txt 2>&1
          rc=$?
          set -e
          cat regression.txt
          case "$rc" in
            0) echo "verdict=ok"        >> "$GITHUB_OUTPUT" ;;
            1) echo "verdict=regression" >> "$GITHUB_OUTPUT" ;;
            *) echo "verdict=error"      >> "$GITHUB_OUTPUT" ;;
          esac

      - name: PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const verdict = '${{ steps.regression.outputs.verdict }}';
            const body = require('fs').readFileSync('regression.txt', 'utf8');
            const tag = '<!-- perf-regression-gate -->';
            const header = verdict === 'regression'
              ? '⚠️ **Bench regression detected**'
              : verdict === 'ok'
              ? '✅ **No bench regression**'
              : '❌ **Bench comparison could not run**';
            const comment = [
              tag,
              header,
              '',
              '```',
              body.slice(0, 6000),
              '```',
              '',
              '<sub>Generated by runtime/.github/workflows/perf.yml. Refresh the baseline with `scripts/refresh-baseline.sh`.</sub>'
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(tag));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

      - name: gate
        # Deliberately last, and deliberately fatal. §4 promises T1
        # regressions fail the build; the comment step above exists so
        # the author sees *why*. An `error` verdict is also fatal: a
        # comparison that could not run has not demonstrated anything,
        # and letting it pass would be the same silent-green bug this
        # pipeline was rewritten to remove.
        run: |
          case "${{ steps.regression.outputs.verdict }}" in
            ok)
              echo "T1 benches: no regression past threshold."
              ;;
            regression)
              echo "::error::T1 bench regression past threshold — see the PR comment and regression.txt"
              exit 1
              ;;
            *)
              echo "::error::Bench comparison did not run cleanly (missing baseline, or no parseable criterion output). Treating as failure."
              exit 1
              ;;
          esac

      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: perf-bench-results
          path: |
            bench-upscaler.txt
            bench-draw_frame.txt
            regression.txt
          retention-days: 30
