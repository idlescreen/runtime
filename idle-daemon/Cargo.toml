[package]
authors = ["idlescreen developers"]
repository = "https://github.com/idlescreen/idlescreen"
name = "idle-daemon"
version = "3.5.18"
edition = "2024"
description = "IdleScreen background idle daemon (Wayland screensaver host)"
license = "Apache-2.0"

[lib]
name = "idle_daemon"
path = "src/lib.rs"

[[bin]]
name = "idle-daemon"
path = "src/bin/idle-daemon.rs"

[[bin]]
name = "idlescreen-daemon"
path = "src/bin/idlescreen-daemon.rs"

[lints]
workspace = true

[dependencies]
idle-runner = { workspace = true }
idle-api = { workspace = true }
idle-dbus = { workspace = true }
idle-upscaler = { workspace = true }
idle-ipc = { path = "../crates/idle-ipc" }
wayland-idle = { workspace = true }
libc = { workspace = true }
zbus = { workspace = true }
tokio = { workspace = true }
idle-err = { workspace = true }
idle-log = { workspace = true }

[package.metadata.deb]
name = "idle-daemon"
changelog = "debian/changelog"
copyright = "2026 IdleScreen"
maintainer = "IdleScreen <jerydleuck@gmail.com>"
extended-description = "IdleScreen background idle monitoring and screensaver host for Wayland."
depends = "libc6, fonts-dejavu-core, dbus"
recommends = "idle-cli, idle-saver-aurora, idle-saver-beams, idle-saver-bursts, idle-saver-chaos, idle-saver-cosmos, idle-saver-glyphs, idle-saver-gnats, idle-saver-hearth, idle-saver-radar, idle-saver-ripple, idle-saver-storm"
suggests = "idle-cosmic"
section = "utils"
priority = "optional"
maintainer-scripts = "debian"
assets = [
    ["target/release/idle-daemon", "usr/bin/idle-daemon", "755"],
    ["target/release/idlescreen-daemon", "usr/bin/idlescreen-daemon", "755"],
    ["assets/idle-daemon.service", "usr/lib/systemd/user/idle-daemon.service", "644"],
    ["assets/io.github.idlescreen.Idle.service", "usr/share/dbus-1/services/io.github.idlescreen.Idle.service", "644"],
    ["assets/idle-daemon.1", "usr/share/man/man1/idle-daemon.1", "644"],
    ["assets/packaging/user-service-lib.sh", "usr/lib/idle/user-service-lib.sh", "644"],
]

[package.metadata.generate-rpm]
name = "idle-daemon"
release = "1"
arch = "x86_64"
summary = "IdleScreen background idle daemon"
description = "IdleScreen background idle monitoring and screensaver host for Wayland."
license = "Apache-2.0"
post_install_script = "rpm/post.sh"
pre_uninstall_script = "rpm/preun.sh"
post_trans_script = "rpm/posttrans.sh"
assets = [
    { source = "target/release/idle-daemon", dest = "/usr/bin/idle-daemon", mode = "755", user = "root", group = "root" },
    { source = "target/release/idlescreen-daemon", dest = "/usr/bin/idlescreen-daemon", mode = "755", user = "root", group = "root" },
    { source = "assets/idle-daemon.service", dest = "/usr/lib/systemd/user/idle-daemon.service", mode = "644", user = "root", group = "root" },
    { source = "assets/io.github.idlescreen.Idle.service", dest = "/usr/share/dbus-1/services/io.github.idlescreen.Idle.service", mode = "644", user = "root", group = "root" },
    { source = "assets/idle-daemon.1", dest = "/usr/share/man/man1/idle-daemon.1", mode = "644", user = "root", group = "root" },
    { source = "assets/packaging/user-service-lib.sh", dest = "/usr/lib/idle/user-service-lib.sh", mode = "644", user = "root", group = "root" },
]

[package.metadata.generate-rpm.requires]
dejavu-sans-mono-fonts = "*"

[package.metadata.generate-rpm.recommends]
idle-cli = "*"
idle-saver-aurora = "*"
idle-saver-beams = "*"
idle-saver-bursts = "*"
idle-saver-chaos = "*"
idle-saver-cosmos = "*"
idle-saver-glyphs = "*"
idle-saver-gnats = "*"
idle-saver-hearth = "*"
idle-saver-radar = "*"
idle-saver-ripple = "*"
idle-saver-storm = "*"

[package.metadata.generate-rpm.suggests]
idle-cosmic = "*"

[package.metadata.generate-rpm.provides]
idle-daemon = "*"
