[package]
authors = ["idlescreen developers"]
repository = "https://github.com/idlescreen/idlescreen"
name = "idle-api"
version = "3.5.0"
edition = "2024"
description = "Lightweight shared API definitions, traits, and math utilities for Wayland GPU screensaver plugins."
license = "Apache-2.0"

[dependencies]
idle-log = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-present = { path = "../crates/wayland-present" }

[[example]]
name = "minimal_saver"
path = "examples/minimal_saver.rs"

