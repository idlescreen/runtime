name: Standard CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: rustup
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Validate page-score.json
      run: qa/page_score_check.sh
    - name: fmt check
      run: cargo fmt --all -- --check

  deny:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Install cargo-deny
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
        cargo binstall -y cargo-deny
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: cargo-deny (advisories, licenses, bans, sources)
      # Bare `cargo deny check` — the previous form was
      # `check advisories licenses`, which silently skipped the `sources` and
      # `bans` sections. `sources` is where deny.toml sets
      # unknown-registry = "deny" / unknown-git = "deny", i.e. the typosquat
      # control, and it was the one thing CI was not running.
      run: cargo deny check

  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: rustup MSRV (1.96.0)
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.96.0
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustc --version
    - name: Cache cargo registry + build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
    - name: MSRV build
      # Cheap MSRV gate: ensure the workspace builds on the floor toolchain.
      # Don't run tests (some tests need newer compilers); the goal is to
      # catch MSRV regressions early.
      run: cargo build --workspace --all-targets

  build:
    runs-on: ubuntu-latest
    needs: fmt
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: System deps
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev libwayland-dev libxkbcommon-dev libssl-dev pkg-config libudev-dev
    - name: rustup + clippy
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustup component add clippy
    - name: Cache cargo registry + build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
    - name: clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

  scripts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Install shellcheck
      run: sudo apt-get update && sudo apt-get install -y shellcheck
    - name: shellcheck QA and harness scripts
      run: |
        shellcheck scripts/qa_hardware_parity.sh
        shellcheck scripts/qa_hardware_parity_tests.sh
        shellcheck scripts/qa_package_gate.sh
        shellcheck scripts/validate_state_alignment.sh
        # -P scripts: chaos_test.sh sources its helpers via "$SCRIPT_DIR", and
        # shellcheck resolves source paths against the source-path, not the
        # script's own location. Without it every helper reports SC1091.
        shellcheck -x -P scripts scripts/chaos_test.sh
        shellcheck -x scripts/chaos_test_dbus.sh
        shellcheck -x scripts/chaos_test_fd.sh
        shellcheck -x scripts/chaos_test_fs.sh
    - name: Hardware parity harness self-test
      # The parity harness can only run on real hardware, so without this it
      # would never execute in CI and would rot. These mock tests drive it
      # end to end and caught three real defects on first run: an unimported
      # `time` in wait_for, an int() cast of a float epoch, and a
      # `python3 -c` argv off-by-one that made every CPU rate read 0.0.
      run: bash scripts/qa_hardware_parity_tests.sh

  test:
    runs-on: ubuntu-latest
    needs: build
    # A deadlocked test must fail the build, not burn a runner for the
    # 6-hour default. See the `apply_commands_drains_channel_until_empty`
    # incident: a `sync_channel(1)` with two `send()` calls hung this job
    # indefinitely because libtest joins every test thread before exit.
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: System deps
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev libwayland-dev libxkbcommon-dev libssl-dev pkg-config libudev-dev
    - name: rustup
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Cache cargo registry + build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
    - name: cargo test
      run: cargo test --workspace --no-fail-fast

  # Blast-radius gate: every downstream repo path-deps on idle-api /
  # idle-runner / idle-dbus. Build them against THIS commit so a breaking
  # API change fails here instead of going red in five repos later.
  downstream:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [savers, studio, tui, cosmic, cli]
    steps:
    - name: Checkout runtime (this commit)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: runtime
    - name: Checkout ${{ matrix.repo }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: idlescreen/${{ matrix.repo }}
        path: downstream
    - name: System deps
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev libwayland-dev libxkbcommon-dev libssl-dev pkg-config libudev-dev
    - name: rustup
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        (cd downstream && rustup show)
    - name: Wire path-dep layout
      # Idempotent on purpose: a fresh checkout can already carry a
      # `runtime` entry (a stale symlink or a directory), and plain
      # `ln -s` then resolves *through* it and dies with
      # "failed to create symbolic link 'downstream/runtime/runtime'".
      run: rm -rf downstream/runtime && ln -s ../runtime downstream/runtime
    - name: cargo check downstream
      run: cd downstream && cargo check --workspace --all-targets